<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" fill="none">
  <defs>
    <style>
      .bg { fill: #fdfbf7; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #0f172a; font-size: 15px; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; }
      .num { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 18px; fill: #ffffff; }
      .arrow { stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="400" rx="20" class="bg"/>

  <!-- Flow Arrows connecting 4 steps -->
  <path d="M 230 200 L 270 200" class="arrow"/>
  <polygon points="270,195 280,200 270,205" fill="#3b82f6"/>

  <path d="M 470 200 L 510 200" class="arrow"/>
  <polygon points="510,195 520,200 510,205" fill="#3b82f6"/>

  <path d="M 710 200 L 750 200" class="arrow"/>
  <polygon points="750,195 760,200 750,205" fill="#3b82f6"/>

  <!-- Step 1: Check-In & Keys -->
  <g transform="translate(30, 70)">
    <rect width="200" height="260" rx="16" class="card"/>
    <circle cx="100" cy="42" r="22" fill="#2563eb"/>
    <text x="100" y="49" text-anchor="middle" class="num">1</text>
    <rect x="55" y="78" width="90" height="20" rx="10" fill="#dbeafe"/>
    <text x="100" y="92" text-anchor="middle" class="badge" fill="#1e40af">ARRIVAL HUB</text>
    <text x="100" y="125" text-anchor="middle" class="title">Keys &amp; Fobs First</text>
    <text x="100" y="152" text-anchor="middle" class="desc">Pick up room key and</text>
    <text x="100" y="170" text-anchor="middle" class="desc">door access card at</text>
    <text x="100" y="188" text-anchor="middle" class="desc">designated check-in hub</text>
    <text x="100" y="210" text-anchor="middle" class="desc" font-weight="bold" fill="#2563eb">before unloading boxes</text>
  </g>

  <!-- Step 2: Room Condition Photos -->
  <g transform="translate(270, 70)">
    <rect width="200" height="260" rx="16" class="card"/>
    <circle cx="100" cy="42" r="22" fill="#f97316"/>
    <text x="100" y="49" text-anchor="middle" class="num">2</text>
    <rect x="50" y="78" width="100" height="20" rx="10" fill="#ffedd5"/>
    <text x="100" y="92" text-anchor="middle" class="badge" fill="#9a3412">PRE-UNPACK</text>
    <text x="100" y="125" text-anchor="middle" class="title">Photo Inspection</text>
    <text x="100" y="152" text-anchor="middle" class="desc">Photograph existing</text>
    <text x="100" y="170" text-anchor="middle" class="desc">scuffs, chips &amp; stains.</text>
    <text x="100" y="188" text-anchor="middle" class="desc">Submit room inventory</text>
    <text x="100" y="210" text-anchor="middle" class="desc" font-weight="bold" fill="#ea580c">to protect deposit</text>
  </g>

  <!-- Step 3: Bed & Power First -->
  <g transform="translate(510, 70)">
    <rect width="200" height="260" rx="16" class="card"/>
    <circle cx="100" cy="42" r="22" fill="#10b981"/>
    <text x="100" y="49" text-anchor="middle" class="num">3</text>
    <rect x="55" y="78" width="90" height="20" rx="10" fill="#d1fae5"/>
    <text x="100" y="92" text-anchor="middle" class="badge" fill="#065f46">FIRST HOUR</text>
    <text x="100" y="125" text-anchor="middle" class="title">Bed &amp; Power Setup</text>
    <text x="100" y="152" text-anchor="middle" class="desc">Encase vinyl mattress,</text>
    <text x="100" y="170" text-anchor="middle" class="desc">put on clean sheets,</text>
    <text x="100" y="188" text-anchor="middle" class="desc">and plug in surge strip</text>
    <text x="100" y="210" text-anchor="middle" class="desc" font-weight="bold" fill="#059669">&amp; fan before fatigue sets in</text>
  </g>

  <!-- Step 4: Staged Unload -->
  <g transform="translate(750, 70)">
    <rect width="180" height="260" rx="16" class="card"/>
    <circle cx="90" cy="42" r="22" fill="#8b5cf6"/>
    <text x="90" y="49" text-anchor="middle" class="num">4</text>
    <rect x="45" y="78" width="90" height="20" rx="10" fill="#ede9fe"/>
    <text x="90" y="92" text-anchor="middle" class="badge" fill="#5b21b6">UNLOAD FLOW</text>
    <text x="90" y="125" text-anchor="middle" class="title">Stage &amp; Settle</text>
    <text x="90" y="152" text-anchor="middle" class="desc">Hang closet clothes,</text>
    <text x="90" y="170" text-anchor="middle" class="desc">set up study desk,</text>
    <text x="90" y="188" text-anchor="middle" class="desc">break down boxes,</text>
    <text x="90" y="210" text-anchor="middle" class="desc" font-weight="bold" fill="#7c3aed">&amp; sync with roommate</text>
  </g>

  <!-- Top Title Banner -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">COLLEGE MOVE-IN DAY EXECUTION TIMELINE</text>
</svg>
