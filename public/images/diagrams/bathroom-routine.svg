<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" fill="none">
  <defs>
    <style>
      .bg { fill: #fdfbf7; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #0f172a; font-size: 15px; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; }
      .icon-bg { fill: #e0f2fe; }
    </style>
  </defs>

  <rect width="960" height="400" rx="20" class="bg"/>

  <!-- Top Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">COMMUNITY BATHROOM TRANSIT &amp; DRY/WET WORKFLOW</text>

  <!-- Zone 1: In-Room Storage (Dry Zone) -->
  <g transform="translate(30, 65)">
    <rect width="280" height="295" rx="16" class="card"/>
    <rect x="20" y="20" width="110" height="24" rx="12" fill="#dbeafe"/>
    <text x="75" y="36" text-anchor="middle" class="badge" fill="#1e40af">ZONE 1: IN ROOM</text>
    <text x="20" y="70" class="title">Dry Staging &amp; Security</text>

    <!-- Item list with icons -->
    <g transform="translate(20, 90)">
      <circle cx="12" cy="12" r="12" class="icon-bg"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🔑</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Room Key / Lanyard</text>
      <text x="32" y="32" class="desc">Never leave without room access</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="12" cy="12" r="12" class="icon-bg"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">📦</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Bulk Refills &amp; Prescriptions</text>
      <text x="32" y="32" class="desc">Store extra bottles in closet/desk</text>
    </g>

    <g transform="translate(20, 190)">
      <circle cx="12" cy="12" r="12" class="icon-bg"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🔌</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Electric Grooming Tools</text>
      <text x="32" y="32" class="desc">Blowdryers &amp; trimmers stay in room</text>
    </g>
  </g>

  <!-- Zone 2: The Transit Carry (Every Trip) -->
  <g transform="translate(340, 65)">
    <rect width="280" height="295" rx="16" class="card" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#d1fae5"/>
    <text x="85" y="36" text-anchor="middle" class="badge" fill="#065f46">ZONE 2: CARRY KIT</text>
    <text x="20" y="70" class="title">Transit Essentials</text>

    <g transform="translate(20, 90)">
      <circle cx="12" cy="12" r="12" fill="#ecfdf5"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🧺</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Mesh Quick-Drain Caddy</text>
      <text x="32" y="32" class="desc">Prevents standing mold/puddle water</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="12" cy="12" r="12" fill="#ecfdf5"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🩴</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Quick-Drying Shower Slides</text>
      <text x="32" y="32" class="desc">Traction &amp; hygiene on wet floors</text>
    </g>

    <g transform="translate(20, 190)">
      <circle cx="12" cy="12" r="12" fill="#ecfdf5"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🧖</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Quick-Dry Towel or Bathrobe</text>
      <text x="32" y="32" class="desc">Dries in 2-3 hours back in dorm room</text>
    </g>
  </g>

  <!-- Zone 3: Post-Shower Ventilation -->
  <g transform="translate(650, 65)">
    <rect width="280" height="295" rx="16" class="card"/>
    <rect x="20" y="20" width="130" height="24" rx="12" fill="#ffedd5"/>
    <text x="85" y="36" text-anchor="middle" class="badge" fill="#9a3412">ZONE 3: DRY-OUT</text>
    <text x="20" y="70" class="title">Ventilation Workflow</text>

    <g transform="translate(20, 90)">
      <circle cx="12" cy="12" r="12" fill="#fff7ed"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">💨</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Hang Caddy Off Floor</text>
      <text x="32" y="32" class="desc">Hang on bed post or shelf hook to air dry</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="12" cy="12" r="12" fill="#fff7ed"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🪝</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Spread Wet Towel Wide</text>
      <text x="32" y="32" class="desc">Never bundle wet towel in a laundry bag</text>
    </g>

    <g transform="translate(20, 190)">
      <circle cx="12" cy="12" r="12" fill="#fff7ed"/>
      <text x="12" y="16" text-anchor="middle" font-size="12">🪥</text>
      <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" fill="#0f172a">Ventilated Toothbrush Cap</text>
      <text x="32" y="32" class="desc">Breathable cover prevents moisture build-up</text>
    </g>
  </g>
</svg>
