<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" fill="none">
  <defs>
    <style>
      .bg { fill: #fdfbf7; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #0f172a; font-size: 14px; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; }
      .measure-line { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <rect width="960" height="400" rx="20" class="bg"/>

  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0f172a" letter-spacing="0.5">THE 4 ESSENTIAL DORM MEASUREMENT ZONES</text>

  <!-- Zone 1: Bed Frame -->
  <g transform="translate(30, 65)">
    <rect width="205" height="295" rx="16" class="card"/>
    <rect x="15" y="20" width="100" height="22" rx="11" fill="#dbeafe"/>
    <text x="65" y="35" text-anchor="middle" class="badge" fill="#1e40af">ZONE A: BED</text>
    <text x="15" y="68" class="title">Under-Bed Height</text>

    <!-- Schematic Diagram of bed frame -->
    <rect x="25" y="90" width="155" height="15" rx="4" fill="#94a3b8"/>
    <line x1="35" y1="105" x2="35" y2="175" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="170" y1="105" x2="170" y2="175" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- Measurement arrow -->
    <line x1="100" y1="105" x2="100" y2="175" class="measure-line"/>
    <text x="105" y="145" font-family="monospace" font-size="11" font-weight="bold" fill="#2563eb">Height ?</text>

    <text x="15" y="210" class="desc" font-weight="bold" fill="#0f172a">Measure before buying:</text>
    <text x="15" y="228" class="desc">• Floor-to-rail clearance</text>
    <text x="15" y="246" class="desc">• Bed lofting notch setting</text>
    <text x="15" y="264" class="desc">• Max tote / drawer height</text>
  </g>

  <!-- Zone 2: Closet & Wardrobe -->
  <g transform="translate(265, 65)">
    <rect width="205" height="295" rx="16" class="card"/>
    <rect x="15" y="20" width="115" height="22" rx="11" fill="#d1fae5"/>
    <text x="72" y="35" text-anchor="middle" class="badge" fill="#065f46">ZONE B: CLOSET</text>
    <text x="15" y="68" class="title">Wardrobe Interior</text>

    <!-- Schematic closet -->
    <rect x="35" y="90" width="135" height="85" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="35" y1="110" x2="170" y2="110" stroke="#94a3b8" stroke-width="3"/>
    <line x1="35" y1="125" x2="170" y2="125" stroke="#475569" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="100" y="150" text-anchor="middle" font-family="monospace" font-size="10" fill="#059669">Door &amp; Shelf Space</text>

    <text x="15" y="210" class="desc" font-weight="bold" fill="#0f172a">Measure before buying:</text>
    <text x="15" y="228" class="desc">• Hanging bar to bottom</text>
    <text x="15" y="246" class="desc">• Top shelf vertical depth</text>
    <text x="15" y="264" class="desc">• Bi-fold vs swing door style</text>
  </g>

  <!-- Zone 3: Desk -->
  <g transform="translate(500, 65)">
    <rect width="205" height="295" rx="16" class="card"/>
    <rect x="15" y="20" width="105" height="22" rx="11" fill="#ede9fe"/>
    <text x="67" y="35" text-anchor="middle" class="badge" fill="#5b21b6">ZONE C: DESK</text>
    <text x="15" y="68" class="title">Study Surface</text>

    <!-- Schematic desk -->
    <rect x="30" y="125" width="145" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="40" y="90" width="125" height="35" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="135" x2="40" y2="175" stroke="#64748b" stroke-width="5"/>
    <line x1="165" y1="135" x2="165" y2="175" stroke="#64748b" stroke-width="5"/>
    <text x="100" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#7c3aed">Hutch Clearance</text>

    <text x="15" y="210" class="desc" font-weight="bold" fill="#0f172a">Measure before buying:</text>
    <text x="15" y="228" class="desc">• Fixed hutch height (if any)</text>
    <text x="15" y="246" class="desc">• Monitor riser width</text>
    <text x="15" y="264" class="desc">• Distance to wall outlet</text>
  </g>

  <!-- Zone 4: Wall & Door -->
  <g transform="translate(735, 65)">
    <rect width="195" height="295" rx="16" class="card"/>
    <rect x="15" y="20" width="115" height="22" rx="11" fill="#ffedd5"/>
    <text x="72" y="35" text-anchor="middle" class="badge" fill="#9a3412">ZONE D: WALLS</text>
    <text x="15" y="68" class="title">Hanging Rules</text>

    <!-- Schematic door & wall hook -->
    <rect x="40" y="90" width="115" height="85" rx="4" fill="#f8fafc" stroke="#f97316" stroke-width="2"/>
    <circle cx="95" cy="115" r="5" fill="#ea580c"/>
    <path d="M 95 120 L 95 135 A 8 8 0 0 0 105 142" stroke="#ea580c" stroke-width="2.5" fill="none"/>
    <text x="95" y="160" text-anchor="middle" font-family="monospace" font-size="10" fill="#c2410c">Wall Policy</text>

    <text x="15" y="210" class="desc" font-weight="bold" fill="#0f172a">Confirm before buying:</text>
    <text x="15" y="228" class="desc">• Pushpins vs adhesives</text>
    <text x="15" y="246" class="desc">• Cinder block vs drywall</text>
    <text x="15" y="264" class="desc">• Over-door hook policy</text>
  </g>
</svg>
