<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="60" y="60" width="1080" height="555" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Decorative Background Pill -->
  <rect x="120" y="120" width="160" height="40" rx="20" fill="#dbeafe"/>
  <text x="200" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#1e40af" letter-spacing="1">MOVE-IN DAY</text>
  
  <!-- Icon & Illustration Elements -->
  <g transform="translate(120, 200)">
