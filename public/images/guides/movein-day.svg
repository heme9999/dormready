    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#2563eb">Step-by-Step Arrival Timeline &amp; Room Inspection</text>
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b">Key pickup, damage photos, unloading sequence &amp; first night survival</text>
  </g>

  <!-- Bottom Badges -->
  <rect x="120" y="480" width="220" height="48" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="230" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#334155">🔑 Key Pickup First</text>

  <rect x="360" y="480" width="240" height="48" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#334155">📸 Pre-Unpack Photos</text>

  <rect x="620" y="480" width="220" height="48" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="730" y="510" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#334155">🛏️ Bed Setup First</text>
